name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: deterministic billing check on fixtures (expected to find the planted errors)
        run: |
          cbc check --terms data/expected/C-002.json --invoices data/invoices/C-002.json
          cbc check --terms data/expected/C-001.json --invoices data/invoices/C-001.json || true
      - name: re-score the committed eval run
        run: cbc eval --predictions evals/runs/latest/predictions.json
        if: hashFiles('evals/runs/latest/predictions.json') != ''
